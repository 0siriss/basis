name: build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Cache native AARs
        uses: actions/cache@v4
        with:
          path: |
            third_party/maven
            third_party/llama.cpp
          key: native-${{ hashFiles('tools/fetch-native.sh') }}
      - name: Fetch native libraries (sherpa-onnx AAR, SHA-256 pinned)
        run: ./tools/fetch-native.sh
      - name: Build, unit tests, lint
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest assembleDebug assembleRelease lintDebug --continue 2>&1 | tee build.log
      - name: Error digest
        if: failure()
        shell: bash
        run: |
          # Short summary at the end of the log (full log is long because of Gradle stack traces).
          grep -nE "^e: |^\[ksp\].*error|error: |What went wrong|Execution failed|Caused by: | FAILED$|AssertionError|expected:" build.log | cut -c1-500 | grep -v "^\s*at " | head -120 || true
          grep -A6 "What went wrong" build.log | head -80 || true
      - name: Upload APKs
        uses: actions/upload-artifact@v6
        with:
          name: basis-apk-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reports-${{ github.run_number }}
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        api: [34, 35, 36]  # 37: emulator-runner can not install platforms;android-37 yet
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          name: basis-apk-${{ github.run_number }}
          path: app/build/outputs/apk
      - name: Get Russian test recording (from the GigaAM archive)
        run: |
          mkdir -p build/asr
          curl -fsSL --retry 3 https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-nemo-transducer-giga-am-v3-russian-2025-12-16.tar.bz2 \
            | tar -xjO --wildcards '*/test_wavs/example.wav' > build/asr/example.wav
          ls -la build/asr
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./tools/ci/emulator-smoke.sh
      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-api${{ matrix.api }}-${{ github.run_number }}
          path: build/smoke/
